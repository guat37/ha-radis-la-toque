name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/radis_la_toque/manifest.json"))["version"])')
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Build manual-install archive
        shell: bash
        run: |
          mkdir -p dist
          cd custom_components
          zip -qr "../dist/radis-la-toque-${GITHUB_REF_NAME}.zip" radis_la_toque
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          EXTRA=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then EXTRA="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes ${EXTRA}
