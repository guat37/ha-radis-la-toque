name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run parser regression suite
        run: python tests/run_regression.py
      - name: Validate frontend syntax
        run: node --check custom_components/radis_la_toque/www/radis-la-toque-card.js
      - name: Validate JSON files
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/radis_la_toque/manifest.json >/dev/null
          python -m json.tool custom_components/radis_la_toque/strings.json >/dev/null
          python -m json.tool custom_components/radis_la_toque/translations/fr.json >/dev/null
